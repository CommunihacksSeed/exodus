name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Every quote must be found in its source
        run: npm run data
      - name: Generated data is committed and up to date
        run: git diff --exit-code src/generated
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
